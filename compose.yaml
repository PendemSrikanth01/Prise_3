name: prise3

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - prise-db-data:/var/lib/postgresql/data
    networks:
      - prise-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      target: migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks:
      - prise-internal
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      AUTOMATION_SECRET: ${AUTOMATION_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      EMAIL_DELIVERY_ENABLED: ${EMAIL_DELIVERY_ENABLED:-false}
      UPLOAD_DIR: /app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${PRISE_PORT:-3010}:3000"
    networks:
      - prise-internal
      - prise-edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1001,gid=1001
    volumes:
      - prise-uploads:/app/uploads
    mem_limit: 768m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  seed:
    profiles: ["tools"]
    build:
      context: .
      target: migrate
    restart: "no"
    command: ["pnpm", "db:seed"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:?Set ADMIN_INITIAL_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - prise-internal
    security_opt:
      - no-new-privileges:true

  mentor-import:
    profiles: ["tools"]
    build:
      context: .
      target: migrate
    restart: "no"
    command: ["pnpm", "mentor:import"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      APP_URL: ${APP_URL:?Set APP_URL in .env}
      UPLOAD_DIR: /app/uploads
      MENTOR_IMPORT_FILE: /app/private-imports/mentors.json
      MENTOR_CREDENTIALS_FILE: /app/private-imports/mentor-credentials.csv
      MENTOR_IMPORT_APPLY: ${MENTOR_IMPORT_APPLY:-false}
      DEACTIVATE_UNLISTED_MENTORS: ${DEACTIVATE_UNLISTED_MENTORS:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - prise-uploads:/app/uploads
      - ./private-imports:/app/private-imports
    networks:
      - prise-internal
      - prise-edge
    security_opt:
      - no-new-privileges:true

networks:
  prise-internal:
    driver: bridge
    internal: true
  prise-edge:
    driver: bridge

volumes:
  prise-db-data:
  prise-uploads:
